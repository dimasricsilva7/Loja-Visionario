name: Reconcile pending payments cron

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Chama a rota de reconciliacao de pagamentos pendentes
        run: |
          curl -sf -X POST "${SITE_URL}/api/cron/reconcile-payments" \
            -H "Authorization: Bearer ${CRON_SECRET}"
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
